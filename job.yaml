resources:
  jobs:
    Pipeline_Cinedata:
      name: Pipeline_Cinedata
      schedule:
        quartz_cron_expression: 37 14 19 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: Task_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/ladssilva@gmail.com/Landing_to_Bronze
            source: WORKSPACE
        - task_key: Task_Silver
          depends_on:
            - task_key: Task_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/ladssilva@gmail.com/Bronze_to_Silver
            source: WORKSPACE
        - task_key: Task_Gold
          depends_on:
            - task_key: Task_Silver
          notebook_task:
            notebook_path: /Workspace/Users/ladssilva@gmail.com/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
